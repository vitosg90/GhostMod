name: Build GhostMod

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build
        run: chmod +x gradlew && ./gradlew build
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: GhostMod
          path: build/libs/*.jar
