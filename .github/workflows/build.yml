name: Build GhostMod

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostMod
          path: build/libs/*.jar
